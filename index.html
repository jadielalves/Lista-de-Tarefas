<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header>
        <h1 id="title">Minhas Tarefas</h1>
    </header>
    <main>
        

        <button id="new-task-button">New Task</button>

        <dialog id="task-dialog">
            Task:
            <input type="text" name="" id="task" placeholder="Digite uma tarefa.">
            Horário:
            <input type="time" name="" id="hour">

            <button id="cancel-button">Cancelar</button>
            <button id="add-button">Adicionar</button>
        </dialog>

        <section id="tasks-list-box">
            <ul id="tasks-list">
                
            </ul>
        </section>

        <section id="empty-list">
            
        </section>

    </main>

    <script type="module" src="js/script.js"></script>
    

</body>
</html>
