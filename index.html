<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
</head>
<body>
    <header>
        <h1>MINHAS TAREFAS</h1>
    </header>
    <main>
        <section id="task-box">
            <input type="text" name="task" id="task" placeholder="Digite uma tarefa...">
            <button id="add-task">+</button>
        </section>

        <section id="tasks-list">
            <ul>
                <li>Estudar JavaScript</li>
                <li>Fazer projetos</li>
                <li>Praticar DOM</li>
            </ul>
        </section>

    </main>
</body>
</html>
